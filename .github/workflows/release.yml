name: Release

# Builds the downloadable Mac app and publishes it as a GitHub release when either:
# - a tag like v0.1.0 is pushed, or
# - the workflow is run by hand from the Actions tab with a version number.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example 0.1.0 (leave empty to only build)"
        required: false
  # Check that packaging still works when the build script changes.
  pull_request:
    paths: ["scripts/**", ".github/workflows/release.yml"]

permissions:
  contents: write

jobs:
  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -o pipefail
          if ! scripts/build-app.sh $VERSION_INPUT 2>&1 | tee build.log; then
            # Show the end of the log as an annotation so the failure is easy to find.
            tail -n 40 build.log | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed -e 's/^/::error title=Build app failed::/'
            echo
            exit 1
          fi
      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: PEPE-PTZ-Controller
          path: dist/PEPE-PTZ-Controller.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [[ -n "$VERSION_INPUT" ]]; then
            TAG="v${VERSION_INPUT#v}"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          # --target creates the tag on this commit if it doesn't exist yet.
          gh release create "$TAG" dist/PEPE-PTZ-Controller.zip \
            --target "$GITHUB_SHA" \
            --title "PEPE PTZ Controller $TAG" \
            --notes-file scripts/release-notes.md
